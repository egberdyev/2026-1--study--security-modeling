project:
  title: "presentation"
  output-dir: "_output"
  render:
    - "*-presentation.qmd"

standalone: true
self-contained: true
slide-level: 2
lang: ru-RU

crossref:
  lof-title: "Список иллюстраций"
  lot-title: "Список таблиц"
  lol-title: "Список листингов"
  fig-title: "Рис."
  tbl-title: "Табл."
  fig-prefix: "рис."
  tbl-prefix: "табл."

bibliography:
  - bib/cite.bib
csl: _resources/csl/gost-r-7-0-5-2008-numeric.csl

format: # Formats
  beamer: # Pdf output format
    toc: true
    toc-title: Содержание
    number-sections: false
    number-depth: 1
    colorlinks: false
    toc-depth: 1
    aspectratio: 169
    section-titles: true
    incremental: false
    navigation: horizontal
    csquotes: true
    indent: true
    include-in-header:
      - file: _resources/tex/beamer.tex
    babel-lang: russian
    babel-otherlangs: english
  revealjs: # Html output
    transition: slide
    margin: 0.2
    smaller: true
    slide-number: true
    output-ext: html
    theme: beige
    logo: _resources/image/logo_rudn.png
  pptx: # MS PowerPoint output
    slide-level: 2
    toc: false
  gfm: # Markdown source
    toc: false
